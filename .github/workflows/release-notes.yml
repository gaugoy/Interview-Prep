name: release-notes

# Publishes one GitHub Release per push to main that changes questions:
# what was added / updated / removed since the previous release (from index/catalog.json).
on:
  push:
    branches: [main]
    paths: ["**.md", "index/catalog.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need previous release tags + their catalog.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Index is up to date
        run: python3 tools/build_index.py --check

      - name: Build release notes since the previous release
        id: notes
        run: |
          prev=$(git tag --list 'release-*' --sort=-creatordate | head -n1)
          tag="release-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          set +e
          python3 tools/release_notes.py ${prev:+--from-ref "$prev"} \
            --title "Question bank update — $(date -u +%Y-%m-%d)" --out notes.md
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$rc" = "0" ] || exit "$rc"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: steps.notes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.notes.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "Question bank update — $(date -u +%Y-%m-%d)" \
            --notes-file notes.md --latest
